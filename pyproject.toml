[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codon-optimization-species-engine"
version = "3.0.1"
description = "Dependency-free codon-usage analysis and RSCU-based optimization utilities"
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
codon-optimization-species-engine = "codon_optimization.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/codon-optimization-species-agent"
Repository = "https://github.com/abusuraihsakhri/codon-optimization-species-agent.git"

[tool.setuptools]
packages = ["codon_optimization"]
