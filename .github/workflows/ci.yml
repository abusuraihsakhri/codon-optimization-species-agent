name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q codon_optimization cli.py codon_optimization_app.py tests

      - name: Run test suite
        run: python -m pytest -p no:zarr -q

      - name: Run CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("out_smoke.csv", encoding="utf-8")))
          assert len(rows) == 4
          assert all(row["status"] == "ok" for row in rows), rows
          assert all(row["optimized_dna"] for row in rows), rows
          print(f"Validated {len(rows)} batch rows")
          PY
          rm out_smoke.csv

      - name: Validate browser assets
        if: matrix.python-version == '3.12'
        run: |
          node --check assets/app.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          Parser().feed(Path("index.html").read_text(encoding="utf-8"))
          required = [
              Path("index.html"),
              Path("assets/app.js"),
              Path("assets/styles.css"),
              Path("codon_optimization/engine.py"),
          ]
          assert all(path.is_file() and path.stat().st_size > 0 for path in required)
          print("Static browser assets validated")
          PY

      - name: Scan tracked files for common secret formats
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- .; then
            echo "Potential secret material detected"
            exit 1
          fi
